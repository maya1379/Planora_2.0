name: CI/CD Pipeline Planora Korchynskyi-18

on:
  push:
    branches:
      - 18-korchynskyi-deploy

env:
  dotnet_version: '10.0.x'
  azure_webapp_name: 'planora-korchynskyi-18'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup .net sdk
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnet_version }}

      - name: restore dependencies
        run: dotnet restore Planora_2.0/Planora.sln

      - name: build solution
        run: dotnet build Planora_2.0/Planora.sln --configuration Release --no-restore

  test:
    name: test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup .net sdk
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnet_version }}

      - name: run tests
        run: dotnet test Planora_2.0/tests/Planora.Tests/Planora.Tests.csproj --configuration Release --verbosity normal

  publish:
    name: publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup .net sdk
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.dotnet_version }}

      - name: publish web app
        run: dotnet publish Planora_2.0/src/Planora.Web/Planora.Web.csproj --configuration Release --output ./myapp

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: planora-app-package
          path: ./myapp
          retention-days: 1

  deploy:
    name: deploy
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: 'CI/CD Pipeline Planora Korchynskyi-18'
      url: https://planora-korchynskyi-18.azurewebsites.net
    steps:
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: planora-app-package
          path: myapp

      - name: deploy to azure web app
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.azure_webapp_name }}
          publish-profile: ${{ secrets.KORCHYNSKYI_18_DEPLOY_AZURE }}
          package: myapp