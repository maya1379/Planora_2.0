name: Deploy to Azure App Service

on:
  push:
    branches:
      - production

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: 'planora-web'    # <-- Replace with your Azure App Service name

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Planora_2.0/src/Planora.Web/Planora.Web.csproj

      - name: Build
        run: dotnet build Planora_2.0/src/Planora.Web/Planora.Web.csproj --configuration Release --no-restore
     
      - name: Test with dotnet
        run: dotnet test Planora_2.0/tests/Planora.Tests/Planora.Tests.csproj --configuration Release --no-build
      
      - name: Publish
        run: dotnet publish Planora_2.0/src/Planora.Web/Planora.Web.csproj --configuration Release --no-build --output ./myapp

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./myapp

