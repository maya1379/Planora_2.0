# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - planora-marichka-15

on:
  push:
    branches:
      - production

env:
  DOTNET_VERSION: '10.0.x'
  AZURE_WEBAPP_NAME: 'planora-marichka-15' # Твоя назва в Azure

jobs:
  # 1. Етап збірки
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore Planora_2.0/src/Planora.Web/Planora.Web.csproj

      - name: Build solution
        run: dotnet build Planora_2.0/src/Planora.Web/Planora.Web.csproj --configuration Release --no-restore

  # 2. Етап тестування
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Run tests
        run: dotnet test Planora_2.0/tests/Planora.Tests/Planora.Tests.csproj --configuration Release

  # 3. Етап підготовки до публікації
  publish:
    name: Publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish web app
        run: dotnet publish Planora_2.0/src/Planora.Web/Planora.Web.csproj --configuration Release --output ./myapp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: planora-app-package
          path: ./myapp
          retention-days: 1

  # 4. Етап розгортання в Azure
  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: planora-app-package
          path: myapp

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: myapp
