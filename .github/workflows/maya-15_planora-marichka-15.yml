# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - planora-marichka-15

on:
  push:
    branches:
      - maya-15
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build Planora_2.0/src/Planora.Web/Planora.Web.csproj

      - name: Test with dotnet
        run: dotnet test Planora_2.0/tests/Planora.Tests/Planora.Tests.csproj --configuration Release --no-build

      - name: dotnet publish
        run: dotnet publish Planora_2.0/src/Planora.Web/Planora.Web.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp
            
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FE5332BD7E7240008C0F7E9ECE22791C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9C231AE8FBAC45F1A355E0705E2FA3A0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_353A30E774FB4A1BA5AEEC2604BD1FAA }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'planora-marichka-15'
          slot-name: 'Production'
          package: .
          
